<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FitDesk — Тренировка</title>
  <script>
    (function() {
      const settings = JSON.parse(localStorage.getItem("fitSettings"));
      if (settings && settings[0]) {
        document.documentElement.classList.add("dark-theme");
      }
    })();
  </script>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-logo">FD</div><span class="brand-name">FitDesk</span></div>
      <nav class="nav">
        <a class="nav-item" href="index.html">Дашборд</a>
        <a class="nav-item" href="calendar.html">Календарь</a>
        <a class="nav-item" href="clients.html">Клиенты</a>
        <a class="nav-item is-active" href="workout.html">Тренировки</a>
        <a class="nav-item" href="exercises.html">Упражнения</a>
        <a class="nav-item" href="settings.html">Настройки</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="breadcrumbs" id="breadcrumb" style="display:flex; align-items:center; gap:12px;">
          Клиенты / 
          <select class="client-selector" id="workoutClientSelect"></select>
          / Неделя 3 · <span id="workoutTitleBreadcrumb">Верх тела A</span>
        </div>
        <div class="topbar-right">
          <div id="timerPill" class="timer-pill"></div>
          <button class="btn btn-primary" id="saveWorkoutBtn">Сохранить</button>
        </div>
      </header>

      <section class="page">
        <div class="page-head">
          <h1 id="workoutTitle">Верх тела A</h1>
          <p class="muted" id="workoutMeta">Загрузка...</p>
        </div>

        <div class="grid grid-12">
          <div class="span-8" id="exerciseList"></div>

          <aside class="span-4">
            <div class="sticky">
              <div class="card">
                <div class="card-head"><h2>Итог сессии</h2></div>
                <dl class="summary">
                  <div><dt>Подходы</dt><dd id="sumSets">0 / 0</dd></div>
                  <div><dt>Упражнения</dt><dd id="sumEx">0</dd></div>
                </dl>
              </div>

              <div class="card">
                <div class="card-head"><h2>Таймер отдыха</h2></div>
                <div id="restTimerCard"></div>
              </div>

              <div class="card">
                <div class="card-head"><h2>Заметка клиенту</h2></div>
                <textarea class="textarea" id="clientNote" rows="4" placeholder="Акцент на медленной эксцентрике…"></textarea>
              </div>
            </div>
          </aside>
        </div>
      </section>
    </main>
  </div>
  <!-- ИСПРАВЛЕНО: правильный путь -->
  <script src="../js/data.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/workout.js"></script>
  <script src="../js/mobile-menu.js"></script>
</body>
</html>
