<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FitDesk — Настройки</title>
  <script>
    (function() {
      const s = JSON.parse(localStorage.getItem("fitSettings"));
      if (s && s[0]) document.documentElement.classList.add("dark-theme");
    })();
  </script>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-logo">FD</div><span class="brand-name">FitDesk</span></div>
      <nav class="nav">
        <a class="nav-item" href="index.html">Дашборд</a>
        <a class="nav-item" href="calendar.html">Календарь</a>
        <a class="nav-item" href="clients.html">Клиенты</a>
        <a class="nav-item" href="workout.html">Тренировки</a>
        <a class="nav-item" href="exercises.html">Упражнения</a>
        <a class="nav-item is-active" href="settings.html">Настройки</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <h2>Настройки</h2>
      </header>

      <section class="page">
        <div class="card">
          <div class="card-head"><h2>Общие настройки</h2></div>
          <div style="display:flex; flex-direction:column; gap:16px;">
            <label style="display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer;">
              <input type="checkbox" style="width:18px; height:18px;" />
              Темная тема оформления
            </label>
            <label style="display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer;">
              <input type="checkbox" style="width:18px; height:18px;" />
              Разрешить клиентам логировать тренировки вне плана
            </label>
            <label style="display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer;">
              <input type="checkbox" style="width:18px; height:18px;" />
              Показывать клиентам весь план целиком
            </label>
            <label style="display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer;">
              <input type="checkbox" style="width:18px; height:18px;" />
              Синхронизация с Google Calendar
            </label>
          </div>
        </div>
      </section>
    </main>
  </div>
  <!-- ИСПРАВЛЕНО: правильный путь -->
  <script src="../js/ui.js"></script>
  <script src="../js/settings.js"></script>
  <script src="../js/mobile-menu.js"></script>
</body>
</html>
